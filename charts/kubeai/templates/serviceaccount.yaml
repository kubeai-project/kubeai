{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubeai.serviceAccountName" . }}
  labels:
    {{- include "kubeai.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
{{- if .Values.modelServiceAccount.create }}
{{- /* Model pods run in their Model's namespace and use this service account there. */}}
{{- range splitList "," (include "models.namespaces" .) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "models.serviceAccountName" $ }}
  namespace: {{ . }}
  labels:
    {{- include "kubeai.labels" $ | nindent 4 }}
  {{- with $.Values.modelServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $.Values.modelServiceAccount.automount }}
{{- end }}
{{- end }}
