apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: distributed-inference-lws
deploy:
  helm:
    releases:
      - name: lws
        remoteChart: oci://registry.k8s.io/lws/charts/lws
        version: 0.8.0
        namespace: default # lws-system
        createNamespace: true
      - name: kubeai
        chartPath: ./charts/kubeai
        valuesFiles:
          - ./test/e2e/distributed-inference-lws/values.yaml
        skipBuildDependencies: true
portForward:
  - resourceType: service
    resourceName: kubeai
    namespace: default
    port: 80
    localPort: 8000
